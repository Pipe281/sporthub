<div class="relative">
  <!-- Label -->
  <label [for]="inputId()" class="mb-2 block text-sm font-medium text-zinc-200">
    {{ label() }}
  </label>

  <!-- Input -->
  <input
    [id]="inputId()"
    [type]="inputType()"
    [placeholder]="placeholder()"
    [formControl]="control()"
    class="form-input"
  />

  <!-- Mostrar / ocultar contraseña -->
  @if (type() === 'password') {
    <button
      type="button"
      (click)="togglePassword()"
      [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      class="absolute top-1/2 right-3 flex -translate-y-1/2 items-center justify-center text-zinc-400 transition-colors duration-200 hover:text-[#9FEA00]"
    >
      <mat-icon>
        {{ showPassword() ? 'visibility_off' : 'visibility' }}
      </mat-icon>
    </button>
  }

  <!-- Error -->
  @if (errorMessage) {
    <p class="mt-1 text-sm text-red-400">
      {{ errorMessage }}
    </p>
  }
</div>
