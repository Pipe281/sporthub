<div class="min-h-screen bg-zinc-950 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-4xl">
    <!-- Encabezado -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-white">Editar instalación</h1>

      <p class="mt-2 text-zinc-400">Actualiza la información de la instalación deportiva.</p>
    </div>

    <!-- Loading -->
    @if (loading()) {
      <div
        class="flex min-h-60 items-center justify-center rounded-2xl border border-zinc-800 bg-zinc-900"
      >
        <p class="text-zinc-400">Cargando instalación...</p>
      </div>

    } @else {
      <!-- Formulario -->
      <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6 shadow-xl sm:p-8">
        <form [formGroup]="facilityForm" (ngSubmit)="submit()" class="space-y-6">
          <!-- Nombre -->
          <app-text-input
            inputId="name"
            label="Nombre"
            placeholder="Ej: Cancha de Pádel 1"
            [control]="facilityForm.controls.name"
          />

          <!-- Descripción -->
          <div>
            <label for="description" class="mb-2 block text-sm font-medium text-zinc-200">
              Descripción
            </label>

            <textarea
              id="description"
              formControlName="description"
              rows="4"
              placeholder="Describe las características de la instalación..."
              class="w-full resize-none rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white transition outline-none focus:border-[#9FEA00]"
            ></textarea>
          </div>

          <!-- Tipo -->
          <div>
            <label for="facility_type_id" class="mb-2 block text-sm font-medium text-zinc-200">
              Tipo de instalación
            </label>

            <select id="facility_type_id" formControlName="facility_type_id" class="select-input">
              <option value="" disabled>Selecciona un tipo</option>

              @for (type of facilityTypes(); track type.id) {
                <option [value]="type.id">
                  {{ type.name }}
                </option>
              }
            </select>
          </div>

          <!-- Capacidad -->
          <app-text-input
            inputId="capacity"
            label="Capacidad"
            type="number"
            placeholder="Ej: 4"
            [control]="facilityForm.controls.capacity"
          />

          <!-- Precio -->
          <app-text-input
            inputId="price_per_hour"
            label="Precio por hora"
            type="number"
            placeholder="Ej: 15000"
            [control]="facilityForm.controls.price_per_hour"
          />

          <!-- Estado -->
          <div>
            <label for="status" class="mb-2 block text-sm font-medium text-zinc-200">
              Estado
            </label>

            <select id="status" formControlName="status" class="select-input">
              <option value="ACTIVE">Activa</option>

              <option value="INACTIVE">Inactiva</option>

              <option value="MAINTENANCE">En mantenimiento</option>
            </select>
          </div>

          <!-- Imagen -->
          <div>
            <label for="image_url" class="mb-2 block text-sm font-medium text-zinc-200">
              Imagen
            </label>

            <input
              id="image_url"
              type="text"
              formControlName="image_url"
              placeholder="URL de la imagen (opcional)"
              class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white transition outline-none focus:border-[#9FEA00]"
            />

            <p class="mt-1 text-xs text-zinc-500">Campo opcional.</p>
          </div>

          <!-- Acciones -->
          <div
            class="flex flex-col-reverse gap-3 border-t border-zinc-800 pt-6 sm:flex-row sm:justify-end"
          >
            <app-button type="button" variant="outline"> Cancelar </app-button>

            <app-button
              type="submit"
              variant="primary"
              [disabled]="facilityForm.invalid"
              [loading]="isSaving()"
            >
              Guardar cambios
            </app-button>
          </div>
        </form>
      </div>
    }
  </div>
</div>
