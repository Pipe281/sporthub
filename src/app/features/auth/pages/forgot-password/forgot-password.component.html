<app-auth-layout
  title="Recuperar contraseña"
  subtitle="Te enviaremos un enlace para restablecer tu contraseña."
  image="/images/forgot-password.jpg"
  heroTitle="Recupera el acceso a tu cuenta"
  heroDescription="Ingresa el correo asociado a tu cuenta y recibirás un enlace para crear una nueva contraseña."
  [showBenefits]="false"
>
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendRecoveryEmail()" class="space-y-6">
    <app-text-input
      inputId="email"
      label="Correo electrónico"
      type="email"
      placeholder="correo@ejemplo.com"
      [control]="forgotPasswordForm.controls.email"
    >
    </app-text-input>

    <app-button [type]="'submit'" [loading]="loading()" [fullWidth]="true">
      Enviar enlace
    </app-button>
  </form>

  <p class="mt-8 text-center text-sm text-zinc-400">
    ¿Recordaste tu contraseña?

    <a routerLink="/login" class="font-semibold text-[#9FEA00] hover:brightness-110">
      Volver al inicio de sesión
    </a>
  </p>
</app-auth-layout>
